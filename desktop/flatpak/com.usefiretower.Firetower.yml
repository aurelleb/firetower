# Firetower as a Flatpak, built from source and offline, the way Flathub
# builds it. See README.md next to this file for how to build it locally and
# how to regenerate the two dependency lists when a lockfile moves.
id: com.usefiretower.Firetower
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: com.usefiretower.Firetower

finish-args:
  # The control plane, and downloads streamed from it.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The tokens, through `keyring`'s Secret Service backend. It speaks to the
  # service directly rather than through the secret portal.
  - --talk-name=org.freedesktop.secrets
  # `tauri-plugin-notification` speaks to the notification daemon directly.
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: firetower
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/firetower/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/firetower/flatpak-node/cache
    build-commands:
      - node pnpm/bin/pnpm.cjs install --offline --frozen-lockfile --trust-lockfile --store-dir "$PWD/flatpak-node/pnpm-store"
      # `pnpm build` is `vite build`, but pnpm 11 re-verifies the install
      # before running any script, cannot confirm a purge without a TTY, and
      # prints an error that is not one.
      - node_modules/.bin/vite build
      # What `tauri build` passes; without it the binary loads the dev server.
      - cargo --offline build --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      # Named after the app id on purpose. GTK takes the window's Wayland
      # app_id from the program name, and the desktop matches a window to its
      # `.desktop` file, icon and name by that id. Tauri's `enableGTKAppId`
      # does not reach it: the id goes to the GApplication, which Tao's
      # windows are not attached to.
      - install -Dm755 src-tauri/target/release/firetower-desktop /app/bin/com.usefiretower.Firetower
      - install -Dm644 flatpak/com.usefiretower.Firetower.desktop -t /app/share/applications
      - install -Dm644 flatpak/com.usefiretower.Firetower.metainfo.xml -t /app/share/metainfo
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.usefiretower.Firetower.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.usefiretower.Firetower.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.usefiretower.Firetower.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.usefiretower.Firetower.png
    sources:
      # The desktop app's own directory. For Flathub this becomes a `git`
      # source pinned to a `desktop-v*` tag and commit.
      - type: dir
        path: ..
        skip:
          - node_modules
          - dist
          - src-tauri/target
          - flatpak/.flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
          - linux/shots
      # pnpm itself, which the Node extension does not carry.
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.28.11.tgz
        sha256: 503ca17f40400740765635d01f6fa7d932efe533604d6f6fe73bd8b489e73ebb
        dest: pnpm
      # Generated by flatpak-builder-tools from the two lockfiles.
      - node-sources.json
      - cargo-sources.json
